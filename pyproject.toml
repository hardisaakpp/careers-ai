[project]
name = "careers-ai"
version = "0.1.0"
description = "Servicio de IA sin estado para el módulo Careers: ranking de ofertas, adaptación de la hoja de vida, carta y PDF."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "jinja2>=3.1", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
careers_ai = ["templates/*.tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
